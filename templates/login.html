{% extends "base.html" %}
{% block content %}
<h1>Login</h1>
<p style="color:#888; font-size:0.85rem; margin-bottom:0.75rem;">Hint: log in with credentials "admin" and "admin123" to view a demo profile with existing data</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    <label>Username: <input type="text" name="username" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <button type="submit">Login</button>
</form>
<p><a href="{{ url_for('register') }}">Register your account</a></p>
{% endblock %}
